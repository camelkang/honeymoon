name: Store screenshots

# 플레이스토어 등록용 휴대폰 스크린샷을 실제 지도로 찍어 store/screenshots/에 커밋
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vite build
      - run: npx playwright test -c playwright.store.config.js
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/screenshots/*.png
          git diff --cached --quiet || git commit -m "Update store screenshots"
          git push
