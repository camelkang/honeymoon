name: Android app (Play Store)

# 플레이스토어용 앱 파일(.aab)을 만듦. 앱 안의 화면은 웹(GitHub Pages)을 그대로 쓰므로
# 웹을 고칠 때는 다시 만들 필요가 없고, 앱 이름·아이콘·버전을 바꿀 때만 실행하면 됨.
# Actions 탭 → "Android app (Play Store)" → Run workflow
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "버전 이름 (예: 1.0.0)"
        default: "1.0.0"
        required: true
  push:
    branches: ["claude/sydney-interactive-travel-map-jt5qxw", "main"]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 업로드 키(서명 키)는 저장소 시크릿에만 있음: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD
      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 시크릿이 없어 서명하지 않은 파일을 만들어요 (스토어에 올릴 수 없음)"
          fi

      # versionCode는 실행 번호로 자동 증가 → 스토어에 올릴 때마다 겹치지 않음
      - name: Build app bundle and APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName="${{ inputs.versionName || '1.0.0' }}"

      - name: Show signing fingerprint
        if: env.ANDROID_KEYSTORE_FILE != ''
        run: |
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -E "SHA256:" || true
          rm -f "$ANDROID_KEYSTORE_FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: duriseo-${{ inputs.versionName || 'build' }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
