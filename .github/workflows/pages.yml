name: Test and deploy

on:
  push:
    branches: ["claude/sydney-interactive-travel-map-jt5qxw", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: mkdir _site && cp -r index.html manifest.webmanifest sw.js icons _site/
      - name: Inject Google Maps API key
        env:
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_KEY" ]; then
            echo "::warning::GOOGLE_MAPS_API_KEY secret is not set; the site falls back to the free map"
          else
            sed -i "s|__GOOGLE_MAPS_API_KEY__|${MAPS_KEY}|" _site/index.html
            grep -q "__GOOGLE_MAPS_API_KEY__" _site/index.html && { echo "::error::key placeholder was not replaced"; exit 1; } || echo "Maps key injected"
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
